<!--
  Migrating to Vite + Vue SFC + TypeScript (see llm/plans/ for the phased migration plan).

  `<script type="module">` is always deferred (runs after the document parses, after every
  classic script, regardless of tag position) -- so once any file becomes a real ES module,
  every remaining classic-style file downstream of it must also run as type="module", or it
  would execute (as a blocking classic script) *before* the module chain that populates the
  window.NW.* globals it reads at parse time (e.g. src/bonus.js destructures `window.NW` at its
  top level). Not-yet-converted files below are therefore marked type="module" even though most
  still just do `window.NW.X = ...` internally rather than real import/export -- that keeps them
  deferred in the same relative order as before, until each is actually rewritten with real
  imports in its own phase. Two files are exempt and stay plain classic scripts:
  vendor/vue.global.prod.js (must run synchronously first, before anything deferred, to set
  window.Vue) and the data/*.js loaders (they resolve their fetch URL via
  `document.currentScript.src`, which is null in module scripts -- Phase 3 of the migration
  removes them in favor of static JSON imports). `npm run dev` (Vite) replaces
  `tools/serve.py` for local development.
-->
<script type="module" src="/src/main.ts"></script>

<script src="vendor/vue.global.prod.js"></script>

<script src="data/schema.js"></script>
<script src="data/slots.js"></script>
