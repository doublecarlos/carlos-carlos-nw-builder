<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carlos Carlos' NW Builder - Neverwinter build planner</title>

    <!-- Routing lives in the query string, so every deep link -- `?build=...` and the rest --
         is this same page with private, local state attached. Pointing them all at the bare
         origin keeps a shared build link from being indexed as a page of its own. -->
    <link rel="canonical" href="https://carloscarlosnwbuilder.pages.dev/" />

    <!-- One description, reused verbatim by Open Graph and Twitter below. Kept under ~160
         characters so search results show it whole rather than clipping mid-sentence. -->
    <meta
      name="description"
      content="Build planner for Neverwinter. Create and compare Neverwinter builds, create and edit new items/bonuses as needed."
    />

    <!-- The page's own chrome colour, per scheme. Matches --bg in src/base.css, so the
         browser UI and the app agree on first paint. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f6f7f9"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1217"
    />

    <!-- Link previews. The URLs here are absolute on purpose: unfurlers fetch these tags out
         of context and many will not resolve a relative image against the page they came from,
         so a relative path costs the card its picture. Same origin as the canonical link above
         and the Sitemap line in public/robots.txt; tests/unit/seo-metadata.spec.ts pins them
         to each other. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://carloscarlosnwbuilder.pages.dev/"
    />
    <meta property="og:site_name" content="Carlos Carlos' NW Builder" />
    <meta
      property="og:title"
      content="Carlos Carlos' NW Builder - Neverwinter build planner"
    />
    <meta
      property="og:description"
      content="Build planner for Neverwinter. Create and compare Neverwinter builds, create and edit new items/bonuses as needed."
    />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://carloscarlosnwbuilder.pages.dev/icon-512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Carlos Carlos' NW Builder icon" />

    <!-- `summary`, not `summary_large_image`: the only artwork is a square icon, and the wide
         card would letterbox it. -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Carlos Carlos' NW Builder - Neverwinter build planner"
    />
    <meta
      name="twitter:description"
      content="Build planner for Neverwinter. Create and compare Neverwinter builds, create and edit new items/bonuses as needed."
    />
    <meta
      name="twitter:image"
      content="https://carloscarlosnwbuilder.pages.dev/icon-512.png"
    />

    <!-- All generated from public/icon-512.png by `npm run icons`. The .ico is listed first
         so it also answers the browser's own unprompted /favicon.ico request. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- What a browser reads to offer "install": the app's name, its icons and the colours to
         paint the window chrome and the launch splash with. It is a plain JSON file with no
         room for comments of its own, so the reasoning for what is in it -- and the assertions
         holding it to this head and to src/base.css -- live in tests/unit/manifest.spec.ts.
         The service worker precaches it along with everything else this page links to. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tells a search engine what kind of thing this page is, which a body of gear tables
         cannot: a free web app, about the game, that needs a browser and nothing else. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Carlos Carlos' NW Builder",
        "url": "https://carloscarlosnwbuilder.pages.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any modern web browser",
        "browserRequirements": "Requires JavaScript.",
        "description": "Build planner for Neverwinter. Create and compare Neverwinter builds, create and edit new items/bonuses as needed.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "about": {
          "@type": "VideoGame",
          "name": "Neverwinter"
        }
      }
    </script>

    <!-- The stored theme, resolved before the first paint.
         `nw:theme` is the key src/stores/theme.ts writes and `.dark` is the class src/base.css
         keys off, so this makes exactly the decision the app makes on load -- only early
         enough to matter. Without it the boot screen below paints in the default theme and the
         bundle repaints it a moment later, which is a flash on every single visit.
         Deliberately inline and synchronous: an external file would be a round-trip, and a
         deferred one would run after the paint it exists to get in front of. localStorage
         throws outright when a browser is set to block site data, and a theme is not worth
         taking the page down for, so a failure here just leaves the default. -->
    <script>
      try {
        const pref = localStorage.getItem("nw:theme") ?? "system";
        const dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {
        // Storage is unreadable; the light default below stands.
      }
    </script>

    <!-- Styles for the boot screen below, and only for it. src/base.css arrives with the
         module bundle, which by definition has not run yet while this is on screen, so these
         few rules have to stand alone. Colours are the light and dark --bg/--text/--muted from
         src/base.css, and the dark rules hang off the same `.dark` class the script above
         sets, so the two themes are chosen the same way here as in the app. -->
    <style>
      body {
        margin: 0;
      }

      /* Both of these restate what the bundle's stylesheet will set on this same element --
         the size from src/base.css, the line height from Tailwind's preflight -- and that is
         the point. Every metric on this screen derives from the two, so leaving either to the
         browser default means the whole splash resizes the moment that stylesheet lands: the
         rem scale steps down from 16px, and every line of text loosens from `normal` to 1.5. */
      html {
        font-size: 14px;
        line-height: 1.5;
      }

      .boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f6f7f9;
        color: #14181f;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      /* The mark itself, at a size a splash wears. It deliberately does not imitate the
         landing screen's watermark: this screen is not that screen, and dressing it up as one
         only promises a layout the app then has to break -- for anyone with saved builds, what
         follows is the builder, not the landing. */
      .boot-mark {
        width: 5rem;
        height: auto;
      }

      .boot-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.025em;
      }

      .boot-loading-message {
        margin: 0;
        color: #667085;
      }

      /* What a crawler or unfurler that never runs the bundle reads. Quiet, because the app
         states all of it properly a second later -- but genuinely rendered, since text served
         only to crawlers is cloaking. */
      .boot-about {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        color: #667085;
      }

      .boot-tagline {
        margin: 0;
      }

      .boot-copy {
        margin: 0;
        max-width: 34rem;
        font-size: 0.875rem;
      }

      .dark .boot {
        background: #0f1217;
        color: #e7ebf2;
      }

      .dark .boot-loading-message,
      .dark .boot-about {
        color: #8d96a5;
      }
    </style>
  </head>
  <body>
    <!-- Vue clears this container when it mounts, so what is written here is the first frame
         and nothing more. It reads as a splash rather than a copy of the landing screen: what
         replaces it is the landing screen only on a first visit, and the builder itself for
         anyone with saved builds, so there is no one layout it could hand over to seamlessly.
         The description below it is what a crawler or link unfurler that never runs the bundle
         sees, so it stays in the markup and stays rendered. -->
    <div id="app">
      <div class="boot" data-testid="boot-screen">
        <img
          class="boot-mark"
          src="/icon-512.png"
          alt=""
          width="512"
          height="512"
        />
        <h1 class="boot-title">Carlos Carlos' NW Builder</h1>
        <p class="boot-loading-message">Loading...</p>
        <div class="boot-about">
          <p class="boot-tagline">Create and compare Neverwinter builds.</p>
          <p class="boot-copy">
            You can define your own items and bonuses using customization
            layers.
            <br />
            Built-in database contains recent gear for Hellbringer and Arbiter.
            <br />
            Everything is saved on your browser - export to download a permanent
            copy.
          </p>
          <noscript>
            <p class="boot-copy">
              The builder runs entirely in the browser and needs JavaScript
              enabled.
            </p>
          </noscript>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
