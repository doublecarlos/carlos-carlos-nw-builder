<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Differential test — new engine vs. legacy oracle</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         margin: 0; padding: 1.5rem; max-width: 110ch; }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; opacity: .7; }
  .banner { padding: .6rem .9rem; border-radius: .4rem; font-weight: 600; margin-bottom: 1rem; }
  .pass { background: #d8f5dc; color: #10391a; }
  .fail { background: #fadcdc; color: #4a1010; }
  @media (prefers-color-scheme: dark) {
    .pass { background: #14351d; color: #b7f0c4; }
    .fail { background: #3d1414; color: #f3bdbd; }
  }
  pre { background: rgba(127,127,127,.12); padding: .9rem; border-radius: .4rem;
        overflow-x: auto; white-space: pre; }
</style>
</head>
<body>
<h1>Differential test — new engine vs. legacy oracle</h1>
<p class="sub">
  Randomised builds run through <code>tools/legacy_engine.py</code> (the sheet's original
  string-matching semantics) and through <code>src/engine.js</code> (the migrated declarative
  model). Every divergence is a migration bug unless it is an intended Part 3 fix.
</p>

<div id="banner" class="banner">running…</div>
<pre id="report">…</pre>

<!-- See index.html's script-block comment for why not-yet-converted classic files need
     type="module" once any file they depend on (here, ../src/legacy-bridge.ts) is a real ES
     module: module scripts always defer until after the document parses, so mixing a blocking
     classic script that reads window.NW.* with a deferred one that sets it would break load
     order regardless of tag position. -->
<script src="../data/schema.js"></script>
<script src="../data/slots.js"></script>
<script src="../data/db-items.js"></script>
<script src="../data/db-bonuses.js"></script>
<script type="module" src="../src/legacy-bridge.ts"></script>
<script type="module" src="differ-cases.js"></script>
<script type="module">
window.NW.dataReady.then(() => {
  const TOLERANCE = 1e-6;

  const close = (a, b) => {
    if (a === b) return true;
    if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
    return Math.abs(a - b) <= TOLERANCE * Math.max(Math.abs(a), Math.abs(b), 1);
  };

  const flatten = (obj, prefix, out) => {
    for (const [key, value] of Object.entries(obj)) {
      const path = prefix ? `${prefix}.${key}` : key;
      if (value !== null && typeof value === 'object') flatten(value, path, out);
      else out[path] = value;
    }
    return out;
  };

  const started = performance.now();
  const db = window.NW.db.fromGlobals();
  const cases = window.NW_DIFFER_CASES ?? [];

  const byField = new Map();        // field path -> { cases, maxAbsDelta, example }
  const explainedBy = new Map();    // bonus id  -> case count
  let comparisons = 0;
  let explainedCases = 0;
  const regressions = [];

  for (const testCase of cases) {
    // `explain: false` skips the per-leaf breakdown -- thousands of builds don't need it.
    const result = window.NW.engine.resolveBuild(db, testCase.build, { explain: false });
    const actual = { capped: result.stages.capped, derived: flatten(result.derived, '', {}) };
    const expected = { capped: testCase.expected.capped,
                       derived: flatten(testCase.expected.derived, '', {}) };

    const fields = [];
    for (const group of ['capped', 'derived']) {
      for (const [field, want] of Object.entries(expected[group])) {
        comparisons += 1;
        const got = actual[group][field];
        if (close(Number(got), Number(want))) continue;
        const path = `${group}.${field}`;
        const delta = Number(got) - Number(want);
        fields.push(path);
        const entry = byField.get(path) ?? { cases: 0, maxAbsDelta: 0, example: null };
        entry.cases += 1;
        if (Math.abs(delta) > entry.maxAbsDelta) {
          entry.maxAbsDelta = Math.abs(delta);
          entry.example = { id: testCase.id, oracle: want, engine: got };
        }
        byField.set(path, entry);
      }
    }
    if (!fields.length) continue;

    // Classify. A divergence is *explained* when the oracle failed to resolve a payload row
    // for a bonus that the new engine has active -- i.e. the sheet silently dropped it, which
    // is precisely the failure mode the redesign removes. Anything else is a regression.
    const dropped = new Set(testCase.oracleDropped ?? []);
    const culprits = result.bonuses
      .filter((b) => b.active && dropped.has(b.id))
      .map((b) => b.id);

    if (culprits.length) {
      explainedCases += 1;
      for (const id of culprits) explainedBy.set(id, (explainedBy.get(id) ?? 0) + 1);
    } else {
      regressions.push({ id: testCase.id, fields: fields.slice(0, 6) });
    }
  }

  const elapsed = performance.now() - started;
  const ok = regressions.length === 0;

  const lines = [
    `${cases.length} randomised builds, ${comparisons.toLocaleString()} comparisons`,
    `${(elapsed / 1000).toFixed(2)}s (${(elapsed / Math.max(cases.length, 1)).toFixed(1)} ms/build)`,
    '',
    `regressions            ${regressions.length}`,
    `explained divergences  ${explainedCases}  (sheet silently dropped a bonus)`,
    '',
  ];

  if (explainedBy.size) {
    lines.push('Bonuses the sheet drops but the new engine resolves:');
    for (const [id, n] of [...explainedBy].sort((a, b) => b[1] - a[1])) {
      lines.push(`  ${id}  — ${n} build(s)`);
    }
    lines.push('');
  }

  if (regressions.length) {
    lines.push('REGRESSIONS (unexplained — these must be fixed):');
    for (const r of regressions.slice(0, 20)) {
      lines.push(`  case ${r.id}: ${r.fields.join(', ')}`);
    }
    lines.push('');
    const sorted = [...byField.entries()].sort((a, b) => b[1].cases - a[1].cases);
    for (const [field, info] of sorted.slice(0, 20)) {
      lines.push(`  ${field}: ${info.cases} case(s), max |Δ| `
        + `${info.maxAbsDelta.toExponential(3)}`);
      lines.push(`      e.g. case ${info.example.id}: `
        + `oracle=${info.example.oracle} engine=${info.example.engine}`);
    }
  } else {
    lines.push(`no unexplained divergences at tolerance ${TOLERANCE}`);
  }

  window.NW_DIFFER_RESULT = {
    ok, cases: cases.length, comparisons, explainedCases,
    regressions, explainedBy: Object.fromEntries(explainedBy),
    fields: Object.fromEntries(byField), elapsedMs: elapsed,
  };

  const banner = document.getElementById('banner');
  banner.className = `banner ${ok ? 'pass' : 'fail'}`;
  banner.textContent = ok
    ? `✓ ${cases.length} builds, ${comparisons.toLocaleString()} comparisons, `
      + `0 regressions (${explainedCases} explained divergence(s))`
    : `✗ ${regressions.length} unexplained divergence(s)`;
  document.getElementById('report').textContent = lines.join('\n');
}).catch((error) => {
  const banner = document.getElementById('banner');
  banner.className = 'banner fail';
  banner.textContent = `FAILED TO LOAD DATA: ${error.message ?? error}`;
});
</script>
</body>
</html>
