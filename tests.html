<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neverwinter builder — golden tests</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         margin: 0; padding: 1.5rem; max-width: 100ch; }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; opacity: .7; }
  .banner { padding: .6rem .9rem; border-radius: .4rem; font-weight: 600; margin-bottom: 1rem; }
  .pass { background: #d8f5dc; color: #10391a; }
  .fail { background: #fadcdc; color: #4a1010; }
  @media (prefers-color-scheme: dark) {
    .pass { background: #14351d; color: #b7f0c4; }
    .fail { background: #3d1414; color: #f3bdbd; }
  }
  pre { background: rgba(127,127,127,.12); padding: .9rem; border-radius: .4rem;
        overflow-x: auto; white-space: pre; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: .25rem .6rem; border-bottom: 1px solid rgba(127,127,127,.25); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Golden tests — new engine vs. the source spreadsheet</h1>
<p class="sub">Every stage of the pipeline and every derived value, compared at 1e-6.</p>

<div id="banner" class="banner">running…</div>
<pre id="report">…</pre>
<div id="detail"></div>

<!-- Classic scripts only: no ES modules, so this page also works from file://. -->
<script src="data/schema.js"></script>
<script src="data/slots.js"></script>
<script src="data/db-items.js"></script>
<script src="data/db-bonuses.js"></script>
<script src="src/conditions.js"></script>
<script src="src/db.js"></script>
<script src="src/bonus.js"></script>
<script src="src/engine.js"></script>
<script src="tests/fixture.js"></script>
<script src="tests/harness.js"></script>
<script src="tests/unit.js"></script>
<script>
(() => {
  let report;
  let unit;
  try {
    report = window.NW.harness.run();
    unit = window.NW.unit.run();
  } catch (error) {
    report = { ok: false, threw: true, totalFailures: 1, cases: [], error: String(error),
               stack: error.stack };
    unit = { ok: false, total: 0, totalFailures: 1, results: [] };
  }

  // Exposed so an automated runner can read the result without scraping the DOM.
  window.NW_TEST_RESULT = report;
  window.NW_UNIT_RESULT = unit;

  const ok = report.ok && unit.ok;
  const banner = document.getElementById('banner');
  banner.className = `banner ${ok ? 'pass' : 'fail'}`;
  banner.textContent = report.threw
    ? `THREW: ${report.error}`
    : (ok
        ? `✓ fixtures reproduced, ${unit.total} unit tests passed`
        : `✗ ${report.totalFailures} fixture mismatch(es), `
          + `${unit.totalFailures} unit assertion(s) failed`);

  document.getElementById('report').textContent = report.threw
    ? report.stack
    : `${window.NW.harness.format(report)}\n\n${'-'.repeat(60)}\n\n`
      + `${window.NW.unit.format(unit)}`;

  // A quick derived-value table for eyeballing, independent of pass/fail.
  const detail = document.getElementById('detail');
  for (const c of report.cases ?? []) {
    const d = c.result.derived;
    const rows = [
      ['Item level', d.itemLevel], ['HP', d.hp], ['Base damage', d.baseDamage],
      ['Damage: average', d.damage.average], ['Damage: crit/no deflect', d.damage.critNoDeflect],
      ['Healing: average', d.healing.average], ['EHP: average', d.ehp.average],
    ];
    const active = c.result.bonuses.filter((b) => b.active).length;
    const table = document.createElement('table');
    table.innerHTML = `<caption style="text-align:left;padding:.6rem 0;opacity:.75">`
      + `${c.name} — ${active}/${c.result.bonuses.length} bonuses active, `
      + `${c.result.errors.length} validation error(s)</caption>`
      + `<tr><th>value</th><th style="text-align:right">engine</th></tr>`
      + rows.map(([label, value]) =>
          `<tr><td>${label}</td><td class="num">${Math.round(value).toLocaleString()}</td></tr>`
        ).join('');
    detail.appendChild(table);
  }
})();
</script>
</body>
</html>
